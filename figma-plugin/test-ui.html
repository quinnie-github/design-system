<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Design System GPT - Test</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #6b7280;
    }
    
    .status {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .status.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }
    
    .button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    
    .button-primary {
      background: #4d79c7;
      color: white;
    }
    
    .button-primary:hover {
      background: #2b58b6;
    }
    
    .button-secondary {
      background: #f3f4f6;
      color: #374151;
    }
    
    .button-secondary:hover {
      background: #e5e7eb;
    }
    
    .log {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Design System GPT</div>
    <div class="subtitle">Test Mode - No Network Access</div>
  </div>
  
  <div id="status" class="status">
    <div id="status-message">Initializing...</div>
  </div>
  
  <button id="test-connection" class="button button-primary">
    Test Connection
  </button>
  
  <button id="create-component" class="button button-secondary">
    Create Test Component
  </button>
  
  <button id="close-plugin" class="button button-secondary">
    Close Plugin
  </button>
  
  <div class="log" id="log">
    <div>Design System GPT Test Log:</div>
  </div>
  
  <script>
    const statusEl = document.getElementById('status');
    const statusMessage = document.getElementById('status-message');
    const logEl = document.getElementById('log');
    
    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      logEl.innerHTML += `<div>[${timestamp}] ${message}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }
    
    function setStatus(message, success = false) {
      statusMessage.textContent = message;
      statusEl.className = `status ${success ? 'success' : ''}`;
    }
    
    // Test connection
    document.getElementById('test-connection').addEventListener('click', () => {
      log('Testing connection...');
      parent.postMessage({ pluginMessage: { type: 'test-connection' } }, '*');
    });
    
    // Create test component
    document.getElementById('create-component').addEventListener('click', () => {
      log('Creating test component...');
      parent.postMessage({ pluginMessage: { type: 'create-test-component' } }, '*');
    });
    
    // Close plugin
    document.getElementById('close-plugin').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    });
    
    // Listen for messages from plugin
    window.addEventListener('message', (event) => {
      const { type, message } = event.data.pluginMessage || {};
      
      switch (type) {
        case 'plugin-ready':
          setStatus(message, true);
          log('Plugin ready');
          break;
        case 'connection-success':
          setStatus(message, true);
          log('Connection test successful');
          break;
        case 'component-created':
          setStatus('Test component created successfully!', true);
          log('Component created');
          break;
        case 'error':
          setStatus(`Error: ${message}`, false);
          log(`Error: ${message}`);
          break;
      }
    });
    
    // Initial log
    log('Design System GPT test interface loaded');
  </script>
</body>
</html>
