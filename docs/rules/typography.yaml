# Typography Token Rules
# Defines text styles, hierarchy, and usage guidelines

metadata:
  version: "1.0"
  last_updated: "2025-01-27"
  description: "Typography system guidelines and text token usage rules"

# Font Families
font_families:
  primary:
    name: "Inter"
    fallbacks: ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"]
    usage: "Primary text, body content, UI elements"
  
  mono:
    name: "JetBrains Mono"
    fallbacks: ["Monaco", "Consolas", "Courier New", "monospace"]
    usage: "Code, technical content, data display"

# Font Weights
font_weights:
  regular: 400
  medium: 500
  semibold: 600
  bold: 700

# Typography Scale
scale:
  xs: "12px"
  sm: "14px"
  base: "16px"
  lg: "18px"
  xl: "20px"
  "2xl": "24px"
  "3xl": "30px"
  "4xl": "36px"
  "5xl": "48px"
  "6xl": "60px"

# Line Heights
line_heights:
  tight: 1.25
  normal: 1.5
  relaxed: 1.75

# Typography Categories
categories:
  headings:
    description: "Text styles for headings and titles"
    hierarchy:
      h1:
        size: "text-5xl"
        weight: "font-bold"
        line_height: "leading-tight"
        usage: "Page titles, hero headings"
      
      h2:
        size: "text-4xl"
        weight: "font-bold"
        line_height: "leading-tight"
        usage: "Section headings, major content titles"
      
      h3:
        size: "text-3xl"
        weight: "font-semibold"
        line_height: "leading-normal"
        usage: "Subsection headings, card titles"
      
      h4:
        size: "text-2xl"
        weight: "font-semibold"
        line_height: "leading-normal"
        usage: "Component headings, form section titles"
      
      h5:
        size: "text-xl"
        weight: "font-medium"
        line_height: "leading-normal"
        usage: "Small headings, label groups"
      
      h6:
        size: "text-lg"
        weight: "font-medium"
        line_height: "leading-normal"
        usage: "Smallest headings, inline labels"

  body:
    description: "Text styles for body content and paragraphs"
    styles:
      large:
        size: "text-lg"
        weight: "font-normal"
        line_height: "leading-relaxed"
        usage: "Important body text, lead paragraphs"
      
      base:
        size: "text-base"
        weight: "font-normal"
        line_height: "leading-normal"
        usage: "Standard body text, paragraphs"
      
      small:
        size: "text-sm"
        weight: "font-normal"
        line_height: "leading-normal"
        usage: "Secondary text, captions, metadata"

  interface:
    description: "Text styles for UI elements and interactive components"
    styles:
      button_large:
        size: "text-lg"
        weight: "font-medium"
        line_height: "leading-tight"
        usage: "Primary buttons, important CTAs"
      
      button_base:
        size: "text-base"
        weight: "font-medium"
        line_height: "leading-tight"
        usage: "Standard buttons, form buttons"
      
      button_small:
        size: "text-sm"
        weight: "font-medium"
        line_height: "leading-tight"
        usage: "Small buttons, icon buttons with text"
      
      label:
        size: "text-sm"
        weight: "font-medium"
        line_height: "leading-tight"
        usage: "Form labels, field labels"
      
      caption:
        size: "text-xs"
        weight: "font-normal"
        line_height: "leading-normal"
        usage: "Helper text, form hints, metadata"

  code:
    description: "Text styles for code and technical content"
    styles:
      inline:
        size: "text-sm"
        weight: "font-normal"
        line_height: "leading-normal"
        font_family: "font-mono"
        usage: "Inline code, variable names"
      
      block:
        size: "text-sm"
        weight: "font-normal"
        line_height: "leading-relaxed"
        font_family: "font-mono"
        usage: "Code blocks, terminal output"

# Typography Tokens
tokens:
  font_family_primary:
    value: "Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    usage: "Primary text content"
  
  font_family_mono:
    value: "JetBrains Mono, Monaco, Consolas, monospace"
    usage: "Code and technical content"
  
  font_size_xs:
    value: "12px"
    usage: "Small captions, helper text"
  
  font_size_sm:
    value: "14px"
    usage: "Small text, form labels, secondary content"
  
  font_size_base:
    value: "16px"
    usage: "Body text, standard content"
  
  font_size_lg:
    value: "18px"
    usage: "Large body text, lead paragraphs"
  
  font_size_xl:
    value: "20px"
    usage: "Small headings, important text"
  
  font_size_2xl:
    value: "24px"
    usage: "Medium headings, section titles"
  
  font_size_3xl:
    value: "30px"
    usage: "Large headings, page titles"
  
  font_size_4xl:
    value: "36px"
    usage: "Extra large headings, hero titles"
  
  font_size_5xl:
    value: "48px"
    usage: "Display headings, major titles"
  
  font_weight_regular:
    value: "400"
    usage: "Body text, normal content"
  
  font_weight_medium:
    value: "500"
    usage: "Emphasized text, labels"
  
  font_weight_semibold:
    value: "600"
    usage: "Headings, important text"
  
  font_weight_bold:
    value: "700"
    usage: "Strong emphasis, primary headings"
  
  line_height_tight:
    value: "1.25"
    usage: "Headings, compact text"
  
  line_height_normal:
    value: "1.5"
    usage: "Body text, standard content"
  
  line_height_relaxed:
    value: "1.75"
    usage: "Large text, readable content"

# Usage Guidelines
guidelines:
  hierarchy:
    - "Use heading levels in order (h1 → h2 → h3, etc.)"
    - "Don't skip heading levels"
    - "Use only one h1 per page"
    - "Maintain consistent heading styles"
  
  readability:
    - "Use appropriate line heights for content length"
    - "Ensure sufficient contrast between text and background"
    - "Use font sizes that are readable on all devices"
    - "Avoid using too many different font sizes"
  
  consistency:
    - "Use the same text styles for similar content"
    - "Maintain consistent spacing around text elements"
    - "Use typography tokens instead of hard-coded values"

# Component-Specific Typography
component_typography:
  buttons:
    primary: "text-base font-medium"
    secondary: "text-sm font-medium"
    small: "text-xs font-medium"
  
  cards:
    title: "text-lg font-semibold"
    subtitle: "text-sm font-medium"
    content: "text-base font-normal"
    metadata: "text-xs font-normal"
  
  forms:
    label: "text-sm font-medium"
    input: "text-base font-normal"
    helper: "text-xs font-normal"
    error: "text-sm font-medium"
  
  navigation:
    primary: "text-base font-medium"
    secondary: "text-sm font-normal"
    breadcrumb: "text-sm font-normal"

# Anti-patterns
anti_patterns:
  - "Using too many different font sizes"
  - "Inconsistent heading hierarchy"
  - "Text that's too small to read comfortably"
  - "Using display fonts for body text"
  - "Inconsistent line heights"
  - "Hard-coded font values instead of tokens"
  - "Poor contrast between text and background"
  - "Using serif fonts for UI elements"
